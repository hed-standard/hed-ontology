---
name: Codespell

on:
  push:
    branches: [main,develop]
  pull_request:
    branches: [main,develop]

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: No CRLF line endings in tracked files
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)' | grep -v 'attr/-text'; then
            echo "CRLF found in the files above; .gitattributes requires LF."
            exit 1
          fi
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
